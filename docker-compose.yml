services:
  db:
    image: postgres:18@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: always
    container_name: postgres_db
    networks:
      - backend-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7.4-alpine
    restart: always
    networks:
      - backend-net
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  migrate:
    build: 
      context: .
      dockerfile: src/Dockerfile
    restart: no
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./src:/app/src
    networks:
      - backend-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PYTHONPATH: /app:/app/src
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: src/Dockerfile
    restart: always
    networks:
      - frontend-net
      - backend-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_URL: redis://redis:6379/0
      PRIVATE_KEY_FILE: /run/secrets/private_key
      PUBLIC_KEY_FILE: /run/secrets/public_key
    secrets:
      - postgres_password
      - private_key
      - public_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine@sha256:c8497b180665e631ec92a5091125bec5b214f0e2b99409e30653a125b37557da
    restart: always
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true 


volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./src/secrets/postgres_password.txt
  private_key:
    file: ./certs/private.pem
  public_key:
    file: ./certs/public.pem