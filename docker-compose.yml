services:
  db:
    image: postgres:18
    restart: always
    container_name: postgres_db
    networks:
      - backend-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
  app:
    build:
      context: .
      dockerfile: src/Dockerfile
    restart: always
    networks:
      - frontend-net
      - backend-net
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: always
    networks:
      - frontend-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - app

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true 


volumes:
  postgres_data: